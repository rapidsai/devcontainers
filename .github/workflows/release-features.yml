name: Release features

on:
  workflow_call:
  workflow_dispatch:

jobs:

  release-features:
    name: Release features
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy common scripts into features
        uses: ./.github/actions/copy-common-scripts

      - name: Install devcontainers CLI
        uses: ./.github/actions/install-devcontainers-cli

      - name: Release features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1
        with:
          generate-docs: true
          publish-features: true
          disable-repo-tagging: true
          base-path-to-features: "./features/src"
          features-namespace: "${{ github.repository }}/features"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
