name: setup-runner-env

description: Setup self-hosted runner environment

runs:
  using: composite
  steps:
    - name: Dump environment
      shell: bash -eo pipefail {0}
      run: | # zizmor: ignore[template-injection]
        echo "env: ${{ toJSON(env) }}"
        echo "runner: '${{ toJSON(runner) }}'"

    - if: runner.environment != 'self-hosted'
      name: Free up disk space
      uses: ./.github/actions/free-disk-space
      with:
        tool_cache: "${{ runner.tool_cache }}"

    - if: runner.environment == 'self-hosted'
      name: Setup self-hosted runner environment
      shell: bash -eo pipefail {0}
      run: | # zizmor: ignore[github-env]
        echo "HOME=$RUNNER_WORKSPACE" >> "$GITHUB_ENV";
        echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV";

    - if: runner.environment == 'self-hosted'
      name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'

    - if: runner.environment != 'self-hosted'
      name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Create docker context
      shell: bash
      run: docker context create builder

    - if: runner.environment != 'self-hosted'
      name: Setup docker buildx on github-hosted runners
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        buildkitd-flags: --debug
        endpoint: builder

    - if: runner.environment == 'self-hosted'
      name: Setup docker buildx on self-hosted runners
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        buildkitd-flags: --debug --config /etc/buildkit/buildkitd.toml
        endpoint: builder
        buildkitd-config: /etc/buildkit/buildkitd.toml
